# Render Blueprint — deploys the whole platform from one file.
#
# Four services: the FastAPI backend, a Postgres database, Redis, and the
# frontend as a static site.
#
# The backend cannot run on the free plan. It starts a background engine at
# boot (see `lifespan` in app/main.py) that polls prices, enforces margin
# stop-outs and writes equity snapshots on a timer. Free Render services sleep
# after ~15 minutes idle, which stops that loop — prices freeze and a losing
# account is never stopped out until somebody happens to load the site.

services:
  # --- API -------------------------------------------------------------------
  - type: web
    name: vanguardia-backend
    runtime: python
    region: oregon
    # Deliberately not `free`: this process must stay awake. See note above.
    plan: starter
    buildCommand: "pip install -r backend/requirements.txt"
    # Runs on every deploy, before the new version goes live. All three steps
    # are idempotent, so redeploying is safe.
    #
    #   alembic          — schema is never behind the code
    #   seed_universe    — the tradeable asset list; without it the markets
    #                      are empty and nothing is quotable
    #   seed_deposit_wallets — the live deposit addresses users are shown
    #
    # `scripts/seed.py` is deliberately NOT run here: it creates a SUPER_ADMIN
    # (admin@vanguardtrading.dev) with a hardcoded password committed to this
    # repo. Create the production admin by hand instead.
    preDeployCommand: "cd backend && alembic upgrade head && python -m scripts.seed_universe && python -m scripts.seed_deposit_wallets"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      # Off in production: with DEBUG on, unhandled errors return stack traces
      # and internal paths to whoever triggered them.
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        fromDatabase:
          name: vanguardia-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: vanguardia-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # The browser origin the API accepts. Must match the site exactly —
      # scheme and host — or every request from the frontend is blocked.
      - key: CORS_ORIGINS
        value: "https://vanguardiafinancial.com,https://www.vanguardiafinancial.com"
      - key: MARKET_DATA_SOURCE
        value: live
      # Optional. Blank leaves Twelve Data inert and prices come from
      # CoinGecko plus Yahoo, which is how it runs today.
      - key: TWELVEDATA_API_KEY
        sync: false

  # --- Frontend --------------------------------------------------------------
  # A static site, not a web service: next.config.ts sets `output: "export"`,
  # which emits plain files into `out/`. There is no Node server to start, so
  # `npm start` would fail here.
  - type: web
    name: vanguardia-frontend
    runtime: static
    buildCommand: "cd frontend-next && npm ci && npm run build"
    staticPublishPath: frontend-next/out
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://api.vanguardiafinancial.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://vanguardiafinancial.com
    # Static export writes each page as `<route>.html` (e.g. app/dashboard.html),
    # but the app links to clean URLs like /app/dashboard. Render only applies
    # a rewrite when no file exists at the requested path, so each clean URL
    # needs mapping to its own .html file — otherwise a browser refresh on
    # that page finds nothing.
    #
    # Do NOT replace these with a catch-all `/* -> /index.html`. That serves
    # the homepage for every refresh, which bounces logged-in users out of the
    # app. Unknown paths should fall through to 404.html instead.
    #
    # Adding a page under src/app? Add its rewrite here too, or refreshing it
    # will 404.
    routes:
      - { type: rewrite, source: /about, destination: /about.html }
      - { type: rewrite, source: /admin, destination: /admin.html }
      - { type: rewrite, source: /admin/audit-logs, destination: /admin/audit-logs.html }
      - { type: rewrite, source: /admin/dashboard, destination: /admin/dashboard.html }
      - { type: rewrite, source: /admin/deposits, destination: /admin/deposits.html }
      - { type: rewrite, source: /admin/positions, destination: /admin/positions.html }
      - { type: rewrite, source: /admin/users, destination: /admin/users.html }
      - { type: rewrite, source: /admin/users/detail, destination: /admin/users/detail.html }
      - { type: rewrite, source: /admin/withdrawals, destination: /admin/withdrawals.html }
      - { type: rewrite, source: /app, destination: /app.html }
      - { type: rewrite, source: /app/accounts, destination: /app/accounts.html }
      - { type: rewrite, source: /app/dashboard, destination: /app/dashboard.html }
      - { type: rewrite, source: /app/markets, destination: /app/markets.html }
      - { type: rewrite, source: /app/markets/asset, destination: /app/markets/asset.html }
      - { type: rewrite, source: /app/portfolio, destination: /app/portfolio.html }
      - { type: rewrite, source: /app/profile, destination: /app/profile.html }
      - { type: rewrite, source: /app/security, destination: /app/security.html }
      - { type: rewrite, source: /app/trade, destination: /app/trade.html }
      - { type: rewrite, source: /app/wallet, destination: /app/wallet.html }
      - { type: rewrite, source: /app/wallet/add-funds, destination: /app/wallet/add-funds.html }
      - { type: rewrite, source: /app/watchlist, destination: /app/watchlist.html }
      - { type: rewrite, source: /faq, destination: /faq.html }
      - { type: rewrite, source: /investments, destination: /investments.html }
      - { type: rewrite, source: /investments/cds, destination: /investments/cds.html }
      - { type: rewrite, source: /investments/etfs, destination: /investments/etfs.html }
      - { type: rewrite, source: /investments/money-market, destination: /investments/money-market.html }
      - { type: rewrite, source: /investments/mutual-funds, destination: /investments/mutual-funds.html }
      - { type: rewrite, source: /investments/stocks, destination: /investments/stocks.html }
      - { type: rewrite, source: /learn, destination: /learn.html }
      - { type: rewrite, source: /login, destination: /login.html }
      - { type: rewrite, source: /markets, destination: /markets.html }
      - { type: rewrite, source: /markets/asset, destination: /markets/asset.html }
      - { type: rewrite, source: /privacy, destination: /privacy.html }
      - { type: rewrite, source: /register, destination: /register.html }
      - { type: rewrite, source: /risk-disclosure, destination: /risk-disclosure.html }
      - { type: rewrite, source: /security-overview, destination: /security-overview.html }
      - { type: rewrite, source: /terms, destination: /terms.html }
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

  # --- Redis -----------------------------------------------------------------
  - type: redis
    name: vanguardia-redis
    region: oregon
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: vanguardia-db
    databaseName: vanguardia
    user: vanguardia
    region: oregon
    # Free Postgres on Render expires 90 days after creation and is deleted.
    # Anything holding real balances belongs on a paid plan.
    plan: basic-256mb
